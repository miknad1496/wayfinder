<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Wayfinder</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; }
    .card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 4px 14px rgba(15,23,42,0.08); max-width: 420px; width: 100%; }
    h1 { font-size: 22px; margin: 0 0 8px 0; color: #0f172a; }
    .sub { color: #64748b; font-size: 14px; margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    button { width: 100%; padding: 11px; background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    .msg.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .msg.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .footer { margin-top: 16px; font-size: 13px; text-align: center; color: #64748b; }
    .footer a { color: #2563eb; text-decoration: none; }
    .step2 { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub">We will email you a 6-digit reset code.</p>
    <div id="msgArea"></div>

    <div id="step1">
      <div class="field">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email">
      </div>
      <button id="requestBtn">Send reset code</button>
    </div>

    <div id="step2" class="step2">
      <div class="field">
        <label for="codeInput">6-digit code (from email)</label>
        <input type="text" id="codeInput" placeholder="123456" maxlength="6" autocomplete="one-time-code">
      </div>
      <div class="field">
        <label for="newPwInput">New password</label>
        <input type="password" id="newPwInput" placeholder="At least 8 chars, with letter and number" autocomplete="new-password">
      </div>
      <button id="resetBtn">Reset password</button>
    </div>

    <div class="footer">
      <a href="/">&larr; Back to login</a>
    </div>
  </div>

  <script>
    const API = (location.hostname === 'localhost') ? 'http://localhost:3000/api' : '/api';
    const $ = (id) => document.getElementById(id);
    function show(type, text) {
      $('msgArea').innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
    }
    let pendingEmail = '';

    $('requestBtn').addEventListener('click', async () => {
      const email = $('emailInput').value.trim();
      if (!email) return show('error', 'Enter your email.');
      $('requestBtn').disabled = true;
      try {
        const res = await fetch(API + '/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        pendingEmail = email;
        show('success', 'If that email exists, a 6-digit code was sent. Check your inbox.');
        $('step1').style.display = 'none';
        $('step2').style.display = 'block';
      } catch (e) {
        show('error', e.message);
      } finally {
        $('requestBtn').disabled = false;
      }
    });

    $('resetBtn').addEventListener('click', async () => {
      const code = $('codeInput').value.trim();
      const newPassword = $('newPwInput').value;
      if (!code || code.length !== 6) return show('error', 'Enter the 6-digit code.');
      if (!newPassword || newPassword.length < 8) return show('error', 'Password must be at least 8 chars.');
      $('resetBtn').disabled = true;
      try {
        const res = await fetch(API + '/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail, code, newPassword }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Reset failed');
        show('success', 'Password reset! Redirecting to login...');
        setTimeout(() => location.href = '/', 1500);
      } catch (e) {
        show('error', e.message);
      } finally {
        $('resetBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
