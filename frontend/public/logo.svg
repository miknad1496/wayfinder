<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Outer ring — solid navy, clean edge -->
  <circle cx="32" cy="32" r="30" fill="#1e3a8a"/>
  <!-- Inner face — pure white, flat -->
  <circle cx="32" cy="32" r="26" fill="#ffffff"/>
  <!-- Cardinal tick marks — bold black, 4 directions -->
  <rect x="31" y="9" width="2" height="6" rx="1" fill="#0f172a"/>
  <rect x="31" y="49" width="2" height="6" rx="1" fill="#0f172a"/>
  <rect x="9" y="31" width="6" height="2" rx="1" fill="#0f172a"/>
  <rect x="49" y="31" width="6" height="2" rx="1" fill="#0f172a"/>
  <!-- North needle — solid blue triangle, pointing up -->
  <path d="M 32 14 L 39 34 L 32 30 L 25 34 Z" fill="#2563eb"/>
  <!-- South needle — solid gray triangle, pointing down -->
  <path d="M 32 50 L 25 30 L 32 34 L 39 30 Z" fill="#94a3b8"/>
  <!-- Center dot — solid navy -->
  <circle cx="32" cy="32" r="3" fill="#1e3a8a"/>
</svg>
