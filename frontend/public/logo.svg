<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <defs>
    <!-- Polished steel face — crisp 5-stop gradient, no muddy mids -->
    <linearGradient id="steel" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f5f8fb" />
      <stop offset="35%" stop-color="#c9d4e0" />
      <stop offset="55%" stop-color="#8da0b5" />
      <stop offset="80%" stop-color="#a8b9cc" />
      <stop offset="100%" stop-color="#5a6e84" />
    </linearGradient>

    <!-- Bezel — sharp luxury watch chromatic ring -->
    <linearGradient id="bezel" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2c3a4c" />
      <stop offset="22%" stop-color="#9eb3c8" />
      <stop offset="48%" stop-color="#475a6e" />
      <stop offset="72%" stop-color="#b6c8da" />
      <stop offset="100%" stop-color="#1f2c3c" />
    </linearGradient>

    <!-- Brand blue needle — saturated, deeper -->
    <linearGradient id="blueNeedle" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Sharp specular highlight (no fuzz) -->
    <radialGradient id="shine" cx="35%" cy="28%" r="22%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Crisp drop-shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.4" />
      <feOffset dx="0" dy="0.4" result="off" />
      <feComponentTransfer><feFuncA type="linear" slope="0.55" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Outer chromatic bezel ring -->
    <circle cx="20" cy="20" r="19" fill="url(#bezel)" />
    <!-- Inner shadow line for bezel depth -->
    <circle cx="20" cy="20" r="17.6" fill="none" stroke="#1a2532" stroke-width="0.3" opacity="0.6" />
    <!-- Polished steel face -->
    <circle cx="20" cy="20" r="17" fill="url(#steel)" />
    <!-- Crisp inner ring (precision instrument) -->
    <circle cx="20" cy="20" r="14.3" fill="none" stroke="#3a4858" stroke-width="0.4" opacity="0.55" />
    <!-- Bright highlight ring -->
    <circle cx="20" cy="20" r="13.6" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.5" />

    <!-- Cardinal tick marks — sharp, bold -->
    <g stroke="#2a3645" stroke-width="0.7" stroke-linecap="round">
      <line x1="20" y1="6.2" x2="20" y2="8.8" />
      <line x1="20" y1="31.2" x2="20" y2="33.8" />
      <line x1="6.2" y1="20" x2="8.8" y2="20" />
      <line x1="31.2" y1="20" x2="33.8" y2="20" />
    </g>

    <!-- Diagonal minor ticks for premium feel -->
    <g stroke="#5a6878" stroke-width="0.35" stroke-linecap="round" opacity="0.7">
      <line x1="10.0" y1="10.0" x2="11.5" y2="11.5" />
      <line x1="30.0" y1="10.0" x2="28.5" y2="11.5" />
      <line x1="10.0" y1="30.0" x2="11.5" y2="28.5" />
      <line x1="30.0" y1="30.0" x2="28.5" y2="28.5" />
    </g>

    <!-- North needle — sharp blue arrow, dominant -->
    <path d="M 20 8.8 L 22.6 19.5 L 20 20.6 L 17.4 19.5 Z" fill="url(#blueNeedle)" stroke="#1e3a8a" stroke-width="0.15" />
    <!-- South needle — silver counterweight -->
    <path d="M 20 31.2 L 17.4 20.5 L 20 19.4 L 22.6 20.5 Z" fill="#5a6e84" stroke="#384858" stroke-width="0.15" opacity="0.75" />

    <!-- Center pivot — crisp jewel -->
    <circle cx="20" cy="20" r="1.8" fill="#1e3a8a" />
    <circle cx="20" cy="20" r="1.2" fill="#3b82f6" />
    <circle cx="19.6" cy="19.6" r="0.45" fill="#ffffff" opacity="0.85" />

    <!-- Sharp specular highlight on top -->
    <circle cx="20" cy="20" r="17" fill="url(#shine)" />
  </g>
</svg>
