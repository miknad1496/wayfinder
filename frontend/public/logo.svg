<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <defs>
    <!-- Bold steel face — strong 3-stop, high contrast -->
    <linearGradient id="face" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#dde6f0" />
      <stop offset="100%" stop-color="#7e92a8" />
    </linearGradient>

    <!-- Bezel — deep navy with strong rim highlight -->
    <linearGradient id="bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1a2c" />
      <stop offset="50%" stop-color="#3b4a60" />
      <stop offset="100%" stop-color="#0a1322" />
    </linearGradient>

    <!-- Brand blue needle — strong saturation -->
    <linearGradient id="needleN" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Silver counterweight -->
    <linearGradient id="needleS" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#9ba9bb" />
      <stop offset="100%" stop-color="#4a5a72" />
    </linearGradient>

    <!-- Soft glow for premium feel -->
    <radialGradient id="glow" cx="35%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer bezel ring — bold, dark -->
  <circle cx="32" cy="32" r="30" fill="url(#bezel)" />
  <!-- Hairline rim highlight -->
  <circle cx="32" cy="32" r="29.4" fill="none" stroke="#9eb3c8" stroke-width="0.35" opacity="0.55" />

  <!-- Steel face -->
  <circle cx="32" cy="32" r="27" fill="url(#face)" />
  <!-- Inner ring detail -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#1f2c3c" stroke-width="0.5" opacity="0.55" />
  <!-- Bright inner highlight -->
  <circle cx="32" cy="32" r="22.8" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.7" />

  <!-- Cardinal tick marks — bold and unmistakable -->
  <g stroke="#0f1a2c" stroke-width="1.4" stroke-linecap="round">
    <line x1="32" y1="9" x2="32" y2="13.5" />
    <line x1="32" y1="50.5" x2="32" y2="55" />
    <line x1="9" y1="32" x2="13.5" y2="32" />
    <line x1="50.5" y1="32" x2="55" y2="32" />
  </g>

  <!-- N E S W letters — small, premium -->
  <text x="32" y="11.8" text-anchor="middle" font-family="Georgia, serif" font-size="3.2" font-weight="700" fill="#0f1a2c" opacity="0.7">N</text>

  <!-- Diagonal minor ticks -->
  <g stroke="#3b4a60" stroke-width="0.7" stroke-linecap="round" opacity="0.65">
    <line x1="15.5" y1="15.5" x2="18" y2="18" />
    <line x1="48.5" y1="15.5" x2="46" y2="18" />
    <line x1="15.5" y1="48.5" x2="18" y2="46" />
    <line x1="48.5" y1="48.5" x2="46" y2="46" />
  </g>

  <!-- North needle — sharp blue arrow, dominant -->
  <path d="M 32 13.5 L 36 31.5 L 32 33 L 28 31.5 Z" fill="url(#needleN)" stroke="#0f1a2c" stroke-width="0.3" />
  <!-- South needle — silver counterweight -->
  <path d="M 32 50.5 L 28 32.5 L 32 31 L 36 32.5 Z" fill="url(#needleS)" stroke="#0f1a2c" stroke-width="0.3" opacity="0.85" />

  <!-- Center pivot jewel — bold, multi-layer -->
  <circle cx="32" cy="32" r="3.2" fill="#0f1a2c" />
  <circle cx="32" cy="32" r="2.4" fill="#1e3a8a" />
  <circle cx="32" cy="32" r="1.6" fill="#3b82f6" />
  <circle cx="31.3" cy="31.3" r="0.7" fill="#ffffff" opacity="0.95" />

  <!-- Soft top glow -->
  <circle cx="32" cy="32" r="27" fill="url(#glow)" opacity="0.7" />
</svg>
